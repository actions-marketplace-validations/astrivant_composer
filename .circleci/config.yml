version: 2.1
jobs:
  test:
    docker:
      - image: cimg/python:3.13
    steps:
      - checkout
      - run:
          name: Install Helm and Poetry
          command: |
            curl -fsSL https://get.helm.sh/helm-v3.19.0-linux-amd64.tar.gz -o /tmp/helm.tar.gz
            tar -xzf /tmp/helm.tar.gz -C /tmp
            sudo install /tmp/linux-amd64/helm /usr/local/bin/helm
            pip install poetry==2.1.3
      - run: poetry install
      - run: poetry check --lock
      - run: poetry run pre-commit validate-manifest .pre-commit-hooks.yaml
      - run: poetry run ruff check pkg tests
      - run: poetry run ruff format --check pkg tests
      - run: poetry run mypy
      - run: poetry run pydoclint --config=pyproject.toml pkg tests
      - run: poetry run python -m unittest discover -s tests
workflows:
  verify:
    jobs:
      - test
