name: Verify reusable action
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create fixture
        shell: bash
        run: |
          mkdir -p fixture/templates
          cat > fixture/Chart.yaml <<'EOF'
          apiVersion: v2
          name: action-fixture
          version: 0.1.0
          EOF
          cat > fixture/templates/pod.yaml <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: app
          spec:
            containers:
              - name: app
                image: busybox:1.36
                command: [sleep, '3600']
          EOF
      - uses: ./
        id: compose
        with:
          commit: 'false'
          watch-directory: '.'
          chart: fixture
          output: generated/compose.yaml
      - name: Validate Compose
        shell: bash
        env:
          COMPOSE_FILE: ${{ steps.compose.outputs.compose-file }}
        run: docker compose -f "$COMPOSE_FILE" config --quiet
      - uses: ./
        with:
          commit: 'false'
          watch-directory: '.'
          chart: fixture
          output: generated/compose.yaml
          check: 'true'
